<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="logoCheckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Icon Section -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="56" height="56" rx="16" fill="#0f172a" stroke="url(#logoGrad)" stroke-width="2.2" />
    
    <!-- Audio Waveform -->
    <rect x="11" y="23" width="3.5" height="10" rx="1.75" fill="#94a3b8" />
    <rect x="17" y="17" width="3.5" height="22" rx="1.75" fill="url(#logoGrad)" />
    <rect x="23" y="12" width="3.5" height="32" rx="1.75" fill="#c084fc" />

    <!-- Checklist Box & Checkmark -->
    <rect x="33" y="15" width="16" height="16" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8" />
    <path d="M36.5 23 L40 26.5 L46 19.5" stroke="url(#logoCheckGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="33" y="35" width="16" height="3" rx="1.5" fill="#64748b" />
    <rect x="33" y="41" width="10" height="3" rx="1.5" fill="#475569" />
  </g>

  <!-- Typography Section -->
  <g transform="translate(72, 16)">
    <!-- Primary Title -->
    <text x="0" y="18" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#f8fafc" letter-spacing="-0.02em">
      MEETING<tspan fill="#818cf8">→</tspan>EXECUTION
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="0" y="33" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" letter-spacing="0.12em">
      COPILOT <tspan fill="#64748b" font-weight="400">| AUDITABLE AI</tspan>
    </text>
  </g>
</svg>
